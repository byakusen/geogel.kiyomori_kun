<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清盛くん 〜平安ものしり問答〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --sumi:#16121c;       /* 墨（少し紫みの夜空） */
    --sumi2:#211a2a;
    --kin:#d9a441;        /* 金 */
    --kin-akarui:#f2cd6b;
    --aka:#a8323a;        /* 朱（平氏の赤） */
    --aka-fuka:#75202a;
    --washi:#f4ead6;      /* 和紙 */
    --washi-kage:#e7d8ba;
    --murasaki:#5c4a7a;   /* 貴族の紫 */
    --sumi-usu:rgba(244,234,214,.7);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Zen Maru Gothic',sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2d4a 0%, transparent 55%),
      radial-gradient(ellipse at 50% 120%, #2a1820 0%, transparent 55%),
      var(--sumi);
    color:var(--washi);
    min-height:100%;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }
  /* 和紙テクスチャ風のノイズ */
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
    pointer-events:none;z-index:0;
  }

  /* ヘッダー（のぼり旗風） */
  header{
    position:relative;z-index:2;
    text-align:center;
    padding:18px 16px 10px;
    border-bottom:3px solid var(--kin);
    background:linear-gradient(180deg, rgba(117,32,42,.35), transparent);
  }
  .mon{
    display:inline-flex;align-items:center;gap:14px;
  }
  .mon-maru{
    width:46px;height:46px;border-radius:50%;
    border:3px solid var(--kin);
    display:grid;place-items:center;
    font-family:'Yuji Syuku',serif;font-size:24px;color:var(--kin-akarui);
    background:radial-gradient(circle,#3a2d4a,#16121c);
  }
  h1{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(28px,4.2vw,52px);
    color:var(--kin-akarui);
    letter-spacing:.12em;
    text-shadow:0 2px 0 #000,0 0 18px rgba(217,164,65,.35);
  }
  .sub{
    font-size:clamp(13px,1.5vw,18px);
    color:var(--sumi-usu);
    margin-top:4px;letter-spacing:.18em;
  }

  /* メイン舞台 */
  main{
    position:relative;z-index:2;
    flex:1;
    width:min(1100px,94vw);
    margin:0 auto;
    padding:22px 0 30px;
    display:flex;flex-direction:column;gap:20px;
  }

  /* 清盛の語り場 */
  .stage{
    display:flex;align-items:flex-start;gap:22px;
  }
  .kiyomori{
    flex:0 0 auto;
    width:clamp(120px,15vw,180px);
    text-align:center;
  }
  .face{
    width:clamp(120px,15vw,180px);
    height:clamp(120px,15vw,180px);
    border-radius:50%;
    overflow:hidden;
    background:#211a2a;
    border:5px solid var(--kin);
    box-shadow:0 0 0 4px var(--sumi),0 10px 30px rgba(0,0,0,.5);
    position:relative;
  }
  /* 口（顔）の絵。閉じた絵と開いた絵を、ぴったり同じ位置に重ねる */
  .face .mouth{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  /* 閉じた口の絵 … いつも見えている（下にしく） */
  .face .mouth.closed{ z-index:1; }
  /* 開いた口の絵 … ふだんは透明で見えない。上に重ねておく */
  .face .mouth.open{ z-index:2; opacity:0; }
  /* 「talking-open」がついた瞬間だけ、開いた口の絵が見える（揺れなし・口だけ動く） */
  .face.talking-open .mouth.open{ opacity:1; }

  .face-fallback{
    display:none;
    position:absolute;inset:0;z-index:3;
    width:100%;height:100%;
    align-items:center;justify-content:center;
    font-family:'Yuji Syuku',serif;
    font-size:clamp(20px,2.6vw,32px);line-height:1.15;
    color:var(--kin-akarui);letter-spacing:.05em;
    background:radial-gradient(circle at 50% 38%, #3a2d4a, #16121c);
  }
  .face.no-img .mouth{ display:none; }
  .face.no-img .face-fallback{display:flex;}
  .name-tag{
    margin-top:10px;font-family:'Yuji Syuku',serif;
    font-size:clamp(16px,2vw,24px);color:var(--kin-akarui);letter-spacing:.1em;
  }

  /* 吹き出し（巻物風） */
  .scroll{
    flex:1;position:relative;
    background:linear-gradient(180deg,var(--washi),var(--washi-kage));
    color:var(--sumi);
    border-radius:14px;
    padding:26px 30px;
    min-height:170px;
    box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 0 0 3px rgba(117,32,42,.25);
    border:2px solid var(--kin);
  }
  .scroll::before{ /* 吹き出しのしっぽ */
    content:"";position:absolute;left:-18px;top:48px;
    border-style:solid;border-width:14px 18px 14px 0;
    border-color:transparent var(--kin) transparent transparent;
  }
  .scroll .answer{
    font-family:'Klee One',serif;
    font-size:clamp(20px,2.6vw,32px);
    line-height:1.75;font-weight:600;
    letter-spacing:.02em;
  }
  .scroll .answer .em{color:var(--aka-fuka);font-weight:700;}

  /* 質問エリア */
  .ask-zone{
    background:rgba(33,26,42,.7);
    border:2px solid var(--kin);
    border-radius:14px;
    padding:18px 20px;
  }
  .ask-zone .label{
    font-size:clamp(15px,1.7vw,20px);color:var(--kin-akarui);
    margin-bottom:12px;letter-spacing:.1em;font-weight:700;
  }
  .input-row{display:flex;gap:12px;flex-wrap:wrap;}
  #q{
    flex:1;min-width:220px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:clamp(18px,2.2vw,26px);font-weight:500;
    padding:14px 18px;border-radius:10px;border:none;
    background:var(--washi);color:var(--sumi);
  }
  #q:focus{outline:3px solid var(--kin-akarui);}
  .btn-ask{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(18px,2.2vw,26px);
    padding:14px 28px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--aka),var(--aka-fuka));
    color:var(--washi);letter-spacing:.1em;
    box-shadow:0 4px 0 #4d141b,0 6px 14px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .btn-ask:active{transform:translateY(4px);box-shadow:0 1px 0 #4d141b;}

  /* おすすめ問い */
  .topics{margin-top:8px;}
  .topics .t-label{font-size:clamp(13px,1.5vw,17px);color:var(--sumi-usu);margin:6px 2px 12px;letter-spacing:.08em;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
    font-size:clamp(15px,1.8vw,21px);
    padding:11px 18px;border-radius:999px;cursor:pointer;
    background:rgba(244,234,214,.08);
    color:var(--washi);
    border:2px solid var(--kin);
    transition:all .15s;
  }
  .chip:hover{background:var(--kin);color:var(--sumi);transform:translateY(-2px);}

  /* モード切替タブ */
  .mode-tabs{
    display:flex;gap:10px;justify-content:center;margin-bottom:4px;
  }
  .mode-tab{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(16px,2vw,22px);
    padding:10px 26px;border:2px solid var(--kin);
    border-radius:999px;cursor:pointer;letter-spacing:.08em;
    background:rgba(244,234,214,.06);color:var(--washi);
    transition:all .15s;
  }
  .mode-tab:hover{transform:translateY(-2px);}
  .mode-tab.active{
    background:linear-gradient(180deg,var(--kin-akarui),var(--kin));
    color:var(--sumi);box-shadow:0 4px 0 #8a6a22;
  }

  /* クイズエリア */
  .quiz-zone{
    background:rgba(33,26,42,.7);
    border:2px solid var(--kin);
    border-radius:14px;
    padding:18px 20px;
  }
  .quiz-top{
    display:flex;justify-content:space-between;align-items:center;
    flex-wrap:wrap;gap:10px;margin-bottom:14px;
  }
  .quiz-count{font-size:clamp(14px,1.6vw,19px);color:var(--kin-akarui);font-weight:700;letter-spacing:.06em;}
  .quiz-score{font-size:clamp(14px,1.6vw,19px);color:var(--washi);font-weight:700;letter-spacing:.06em;}
  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
    font-size:clamp(17px,2.1vw,24px);
    text-align:left;padding:15px 20px;border-radius:12px;cursor:pointer;
    background:var(--washi);color:var(--sumi);
    border:3px solid transparent;
    transition:all .12s;
  }
  .choice:hover:not(:disabled){border-color:var(--kin);transform:translateY(-2px);}
  .choice:disabled{cursor:default;}
  .choice.correct{background:#cfe3bf;border-color:var(--midori,#5c7a4a);color:#274016;}
  .choice.wrong{background:#f0c4c4;border-color:var(--aka);color:#6b1d1d;}
  .quiz-next-row{margin-top:16px;text-align:right;min-height:8px;}
  .btn-next{
    font-family:'Yuji Syuku',serif;
    font-size:clamp(16px,2vw,22px);
    padding:12px 26px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(180deg,var(--aka),var(--aka-fuka));
    color:var(--washi);letter-spacing:.08em;
    box-shadow:0 4px 0 #4d141b,0 6px 14px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .btn-next:active{transform:translateY(4px);box-shadow:0 1px 0 #4d141b;}
  .hidden{display:none !important;}

  /* 平氏一族ずかん（家系図） */
  .zukan-zone, .nenpyo-zone{
    background:rgba(33,26,42,.7);
    border:2px solid var(--kin);
    border-radius:14px;
    padding:18px 20px;
  }
  .zone-lead{font-size:clamp(14px,1.6vw,19px);color:var(--kin-akarui);font-weight:700;letter-spacing:.06em;margin-bottom:14px;}
  .zukan-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:12px;
  }
  .person{
    font-family:'Zen Maru Gothic',sans-serif;
    text-align:center;padding:14px 8px;border-radius:12px;cursor:pointer;
    background:var(--washi);color:var(--sumi);
    border:3px solid transparent;
    transition:transform .12s,border-color .12s;
  }
  .person:hover{border-color:var(--kin);transform:translateY(-3px);}
  .person.on{border-color:var(--aka);background:#f3e6cf;}
  .person .pname{font-weight:700;font-size:clamp(16px,1.9vw,21px);}
  .person .prel{font-size:clamp(12px,1.4vw,15px);color:var(--aka-fuka);margin-top:4px;letter-spacing:.04em;}
  .person.genji{background:#e7eef4;}
  .person.genji .prel{color:#2a4a6b;}

  /* 栄えとほろび 年表 */
  .nenpyo-line{
    display:flex;flex-direction:column;gap:0;position:relative;
    padding-left:14px;
  }
  .ev{
    display:flex;gap:14px;cursor:pointer;padding:10px 8px;border-radius:10px;
    border:2px solid transparent;transition:background .12s,border-color .12s;
    align-items:flex-start;
  }
  .ev:hover{background:rgba(244,234,214,.06);border-color:var(--kin);}
  .ev.on{background:rgba(168,50,58,.18);border-color:var(--aka);}
  .ev .yr{
    flex:0 0 auto;width:74px;text-align:right;
    font-family:'Yuji Syuku',serif;font-size:clamp(15px,1.8vw,21px);
    color:var(--kin-akarui);
  }
  .ev .dot{
    flex:0 0 auto;width:16px;height:16px;border-radius:50%;margin-top:4px;
    border:3px solid var(--washi);
  }
  .ev.up .dot{background:var(--kin);}      /* 栄え */
  .ev.down .dot{background:var(--aka);}     /* おとろえ */
  .ev .ev-title{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
    font-size:clamp(16px,1.9vw,22px);color:var(--washi);padding-top:1px;
  }
  .nenpyo-legend{
    display:flex;gap:18px;justify-content:center;margin-top:14px;
    font-size:clamp(12px,1.4vw,15px);color:var(--sumi-usu);
  }
  .nenpyo-legend .lg{display:inline-flex;align-items:center;gap:6px;}
  .nenpyo-legend .sw{width:13px;height:13px;border-radius:50%;display:inline-block;}
  .sw.up{background:var(--kin);} .sw.down{background:var(--aka);}

  footer{
    position:relative;z-index:2;text-align:center;
    font-size:13px;color:rgba(244,234,214,.4);
    padding:14px;letter-spacing:.1em;
  }
  @media(max-width:560px){
    .stage{flex-direction:column;align-items:center;}
    .scroll::before{display:none;}
    .kiyomori{order:-1;}
  }
</style>
</head>
<body>
  <header>
    <div class="mon">
      <span class="mon-maru">清</span>
      <div>
        <h1>清盛くん</h1>
        <div class="sub">へいあん ものしり もんどう</div>
      </div>
      <span class="mon-maru">盛</span>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="kiyomori">
        <div class="face" id="face">
          <img class="mouth closed"
               src="https://github.com/byakusen/geogel.kiyomori_kun/blob/main/kiyomori3.png?raw=true"
               alt="平清盛（口を閉じた絵）"
               onerror="this.closest('.face').classList.add('no-img');">
          <img class="mouth open"
               src="https://github.com/byakusen/geogel.kiyomori_kun/blob/main/kiyomori4.png?raw=true"
               alt="" aria-hidden="true">
          <span class="face-fallback">平<br>清<br>盛</span>
        </div>
        <div class="name-tag">平清盛</div>
      </div>
      <div class="scroll">
        <div class="answer" id="answer"></div>
      </div>
    </div>

    <div class="mode-tabs">
      <button class="mode-tab active" id="tabAsk">きく</button>
      <button class="mode-tab" id="tabQuiz">クイズ</button>
      <button class="mode-tab" id="tabZukan">一族ずかん</button>
      <button class="mode-tab" id="tabNenpyo">年表</button>
    </div>

    <div class="ask-zone" id="askZone">
      <div class="label">▼ 清盛くんに きいてみよう</div>
      <div class="input-row">
        <input id="q" type="text" placeholder="しつもんを 入力してね（れい：日宋貿易ってなに？）" autocomplete="off">
        <button class="btn-ask" id="askBtn">きく</button>
      </div>
    </div>

    <div class="quiz-zone hidden" id="quizZone">
      <div class="quiz-top">
        <span class="quiz-count" id="quizCount">第1問</span>
        <span class="quiz-score" id="quizScore">せいかい 0 / 0</span>
      </div>
      <div class="choices" id="choices"></div>
      <div class="quiz-next-row">
        <button class="btn-next hidden" id="nextBtn">つぎの問題 ▶</button>
      </div>
    </div>

    <div class="zukan-zone hidden" id="zukanZone">
      <div class="zone-lead">▼ 人物をタップすると、清盛がその人のことを話します（金ぶち＝平氏／青ぶち＝源氏）</div>
      <div class="zukan-grid" id="zukanGrid"></div>
    </div>

    <div class="nenpyo-zone hidden" id="nenpyoZone">
      <div class="zone-lead">▼ 出来事をタップすると、清盛がそのときのことを話します</div>
      <div class="nenpyo-line" id="nenpyoLine"></div>
      <div class="nenpyo-legend">
        <span class="lg"><span class="sw up"></span>栄えていくとき</span>
        <span class="lg"><span class="sw down"></span>おとろえていくとき</span>
      </div>
    </div>
  </main>

  <footer>クラスで楽しむ 平安・源平もんどうアプリ／答えは小学生むけにやさしくまとめています</footer>

<script>
// ===== 清盛の知識（小学4年生むけ・清盛口調）100問 =====
// キーワードに当てはまる問いが来たら、その答えを返す。
const KB = [
  // ----- 生い立ち・家族 -----
  {
    keys:["生まれ","うまれ","いつ生","何年生","誕生","生年","いつのひと","時代","じだい"],
    a:"わしが生まれたのは1118年、平安時代の終わりごろじゃ。生まれた場所は伊勢国(いまの三重県津市あたり)という説が有力でな。父は武士の平忠盛(たいらのただもり)。わしは「平氏(へいし)」という武士の一族の、あとつぎとして生まれたのじゃ。"
  },
  {
    keys:["父","ちち","おとう","忠盛","ただもり"],
    a:"わしの父は平忠盛(たいらのただもり)じゃ。海ぞいの土地をおさめ、また西国とのつながりで力をたくわえた武士でな。朝廷(天皇のまわりの政府)にも仕え、平氏が世に出るための土台をきずいた人物よ。わしはその父のあとをついで、平氏の棟梁(とうりょう=かしら)となったのじゃ。"
  },
  {
    keys:["母","はは","おかあ","母親","ははおや"],
    a:"じつはわしの母が誰であったかは、はっきりとは分かっておらぬ。白河法皇(しらかわほうおう)に仕えた女性であったとも伝わるが、たしかな記録は少ない。歴史には、有名な人物でも分からぬことがいくらでもある。それもまた、調べるおもしろさよ。"
  },
  {
    keys:["白河","しらかわ","落胤","らくいん","本当の父","ほんとうの父","ほんとうのちち","かくし子","ご落胤"],
    a:"『平家物語』には、わしはじつは白河法皇(しらかわほうおう=とても力のあった上皇)の子であった、という噂話がのっておる。これを「落胤(らくいん)説」というのじゃ。ただし、これはあとの世に作られた話で、本当かどうかはあやしいとされておる。なぜそんな噂が出たかというと、身分の高くないわしが、武士で初めて朝廷の最高の位までのぼったからじゃろうな。"
  },
  {
    keys:["祇園女御","ぎおんにょうご","ぎおんにょご","育ての親","そだての親"],
    a:"祇園女御(ぎおんにょうご)は、わしの幼いころに後ろだてとなってくれた、身分の高い女性じゃ。彼女の力もあって、わしは小さいころから出世のチャンスにめぐまれた。後ろだてのある子は引き立てられる――そういう世の中であったのじゃ。"
  },
  {
    keys:["平氏","平家","平氏について","平家について","先祖","せんぞ","桓武","かんむ","平氏とは","へいしとは","平家とは","へいけとは","平氏って","平の名"],
    a:"わしらの一族「平氏(へいし)」は、もとをたどれば桓武天皇(かんむてんのう)という天皇の子孫じゃ。だから「桓武平氏(かんむへいし)」ともいう。その中でも伊勢国(三重県)を根じろにした者たちを「伊勢平氏」とよぶ。天皇の血を引きながら、武士として生きたのがわしらよ。わしの代に栄華(えいが)をきわめ、義弟の時忠は「平氏(平家)にあらずんば人にあらず＝平氏の者でなければ人ではない」とまで言ったほどじゃ。じゃが、そのおごりはやがて多くの敵を生み、源氏との戦いでほろびることになる。栄えとおとろえ――それが平氏の歩みなのじゃ。"
  },
  {
    keys:["伊勢平氏","いせへいし","伊勢"],
    a:"「伊勢平氏(いせへいし)」とは、伊勢国(いまの三重県)を根じろにした平氏の一族のことじゃ。わしの父・忠盛、そしてわしは、この伊勢平氏の棟梁(とうりょう=かしら)であった。地方の武士の家から身をおこし、ついには都の政治を動かすまでになったのじゃ。"
  },
  {
    keys:["先祖の名","平高望","たかもち","平国香","平正盛","系図","けいず"],
    a:"わしの先祖をたどると、桓武天皇 → 平高望(たかもち) → …と続き、祖父の平正盛(まさもり)、父の忠盛、そしてわし清盛、という流れになる。代々、武士として少しずつ力をのばし、わしの代で大きく花ひらいたのじゃ。"

// 入力にいちばん合う答えをさがす
function findAnswer(text){
  const t = (text||"").replace(/\s/g,"");
  if(!t) return null;
  let best=null, bestScore=0;
  for(const item of KB){
    let score=0;
    for(const k of item.keys){ if(t.includes(k)) score += k.length; }
    if(score>bestScore){bestScore=score; best=item;}
  }
  return bestScore>0 ? best.a : null;
}

// ===== タイプライター表示 + 口パク =====
const answerEl = document.getElementById('answer');
const faceEl = document.getElementById('face');
let typing=null;

// --- 口パク（揺れなし。口の絵だけを開け閉めする）---
let mouthTimer=null;
function startMouth(){
  stopMouth();
  mouthTimer=setInterval(()=>{ faceEl.classList.toggle('talking-open'); },130);
}
function stopMouth(){
  if(mouthTimer){ clearInterval(mouthTimer); mouthTimer=null; }
  faceEl.classList.remove('talking-open');  // 最後は口を閉じた絵にもどす
}

function speak(text){
  if(typing) clearInterval(typing);
  startMouth();                 // しゃべりはじめ：口を動かす
  answerEl.innerHTML="";
  let i=0;
  typing=setInterval(()=>{
    if(i>=text.length){
      clearInterval(typing); typing=null;
      stopMouth();              // しゃべりおわり：口を止める
      return;
    }
    answerEl.appendChild(document.createTextNode(text[i]));
    i++;
  },32);
}

function handleAsk(text){
  const a = findAnswer(text);
  if(a){ speak(a); }
  else{ speak(NOT_FOUND[Math.floor(Math.random()*NOT_FOUND.length)]); }
}

let quizIndex=0, quizScore=0, quizAnswered=false;
let quizOrder=[];

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const choicesEl=document.getElementById('choices');
const quizCountEl=document.getElementById('quizCount');
const quizScoreEl=document.getElementById('quizScore');
const nextBtn=document.getElementById('nextBtn');

function startQuiz(){
  quizOrder=shuffle([...Array(QUIZ.length).keys()]);
  quizIndex=0; quizScore=0;
  speak("では、清盛クイズじゃ！　全"+QUIZ.length+"問、何問わかるかな？　下の3つから、正しいと思うものをえらぶがよい！");
  showQuestion();
}

function showQuestion(){
  quizAnswered=false;
  nextBtn.classList.add('hidden');
  const item=QUIZ[quizOrder[quizIndex]];
  quizCountEl.textContent="第"+(quizIndex+1)+"問 / "+QUIZ.length+"問";
  quizScoreEl.textContent="せいかい "+quizScore+" / "+quizIndex;
  // 選択肢をシャッフルして表示
  const order=shuffle([0,1,2]);
  choicesEl.innerHTML="";
  // 問題文を吹き出しに（揺れなし・口パクで出題）
  if(typing){ clearInterval(typing); typing=null; }
  answerEl.innerHTML="";
  const qtext="【第"+(quizIndex+1)+"問】"+item.q;
  startMouth();
  let qi=0;
  typing=setInterval(()=>{
    if(qi>=qtext.length){ clearInterval(typing); typing=null; stopMouth(); return; }
    answerEl.appendChild(document.createTextNode(qtext[qi]));
    qi++;
  },28);
  order.forEach(ci=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.textContent=item.c[ci];
    btn.onclick=()=>chooseAnswer(ci, btn);
    choicesEl.appendChild(btn);
  });
}

function chooseAnswer(ci, btn){
  if(quizAnswered) return;
  quizAnswered=true;
  const item=QUIZ[quizOrder[quizIndex]];
  const allBtns=choicesEl.querySelectorAll('.choice');
  allBtns.forEach(b=>{
    b.disabled=true;
    if(b.textContent===item.c[item.correct]) b.classList.add('correct');
  });
  if(ci===item.correct){
    quizScore++;
    speak("せいかい！　"+item.exp);
  }else{
    btn.classList.add('wrong');
    speak("ざんねん、ちがうのじゃ。正しい答えは「"+item.c[item.correct]+"」。"+item.exp);
  }
  quizScoreEl.textContent="せいかい "+quizScore+" / "+(quizIndex+1);
  nextBtn.classList.remove('hidden');
  nextBtn.textContent = (quizIndex+1>=QUIZ.length) ? "けっかを見る ▶" : "つぎの問題 ▶";
}

nextBtn.onclick=()=>{
  quizIndex++;
  if(quizIndex>=QUIZ.length){
    finishQuiz();
  }else{
    showQuestion();
  }
};

function finishQuiz(){
  choicesEl.innerHTML="";
  nextBtn.classList.add('hidden');
  quizCountEl.textContent="けっか はっぴょう";
  quizScoreEl.textContent="せいかい "+quizScore+" / "+QUIZ.length;
  let msg;
  const ratio=quizScore/QUIZ.length;
  if(ratio===1){
    msg="あっぱれ！　全問せいかいじゃ！　そなたはもう、立派な平氏の物知りよ。天下をまかせられるのう！";
  }else if(ratio>=0.7){
    msg="みごとじゃ！　"+QUIZ.length+"問中"+quizScore+"問せいかい。よう学んでおるな、感心したぞ。";
  }else if(ratio>=0.4){
    msg=QUIZ.length+"問中"+quizScore+"問せいかいじゃ。なかなかよいぞ。もう一度ちょうせんして、満点をめざすがよい！";
  }else{
    msg=QUIZ.length+"問中"+quizScore+"問……まだまだこれからよ！　『きく』モードでわしの話を聞いてから、もう一度ちょうせんしてみよ。";
  }
  speak(msg);
  // もう一度ボタンを選択肢エリアに
  const again=document.createElement('button');
  again.className='choice';
  again.style.textAlign='center';
  again.textContent="もう一度クイズに ちょうせんする";
  again.onclick=startQuiz;
  choicesEl.appendChild(again);
}

function buildZukan(){
  if(zukanBuilt) return;
  ZUKAN.forEach(p=>{
    const el=document.createElement('div');
    el.className='person'+(p.side==='genji'?' genji':'');
    el.innerHTML='<div class="pname">'+p.name+'</div><div class="prel">'+p.rel+'</div>';
    el.onclick=()=>{
      zukanGrid.querySelectorAll('.person').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      speak(p.talk);
    };
    zukanGrid.appendChild(el);
  });
  zukanBuilt=true;
}

function buildNenpyo(){
  if(nenpyoBuilt) return;
  NENPYO.forEach(ev=>{
    const el=document.createElement('div');
    el.className='ev '+ev.trend;
    el.innerHTML='<span class="yr">'+ev.year+'</span><span class="dot"></span><span class="ev-title">'+ev.title+'</span>';
    el.onclick=()=>{
      nenpyoLine.querySelectorAll('.ev').forEach(x=>x.classList.remove('on'));
      el.classList.add('on');
      speak(ev.talk);
    };
    nenpyoLine.appendChild(el);
  });
  nenpyoBuilt=true;
}

const TABS=[tabAsk,tabQuiz,tabZukan,tabNenpyo];
const ZONES=[askZone,quizZone,zukanZone,nenpyoZone];

function switchMode(activeTab, activeZone){
  TABS.forEach(t=>t.classList.toggle('active', t===activeTab));
  ZONES.forEach(z=>z.classList.toggle('hidden', z!==activeZone));
}

tabAsk.onclick=()=>{ switchMode(tabAsk,askZone); speak(GREET); };

const qEl=document.getElementById('q');

// IME（日本語入力）の変換確定中かどうかを記録する
let composing=false;
qEl.addEventListener('compositionstart',()=>{ composing=true; });
qEl.addEventListener('compositionend',()=>{ composing=false; });

document.getElementById('askBtn').onclick=()=>handleAsk(qEl.value);
qEl.addEventListener('keydown',e=>{
  // 漢字変換などの確定リターンでは送信しない。
  // 変換が確定し、ふつうにリターンを押したときだけ質問を送る。
  if(e.key==='Enter' && !composing && !e.isComposing){
    handleAsk(qEl.value);
  }
});
